services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD:?Set SA_PASSWORD in .env}
    ports:
      - "1433:1433"
    volumes:
      - trips_sqlserver_data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  trips-api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__TripsDb: "Server=sqlserver,1433;Database=Trips_DB;User Id=sa;Password=${SA_PASSWORD:?Set SA_PASSWORD in .env};Encrypt=True;TrustServerCertificate=True;"
    ports:
      - "5001:8080"
    depends_on:
      sqlserver:
        condition: service_healthy

volumes:
  trips_sqlserver_data:
